[project]
name = "housing-intelligence"
version = "0.0.1"
description = "Residential intelligence platform for Comunidad de Madrid"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hi-contracts",
    "hi-domain",
    "hi-db",
    "hi-ingestion",
    "hi-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/contracts", "packages/domain", "packages/db", "services/ingestion"]

[tool.uv.sources]
hi-contracts = { workspace = true }
hi-domain = { workspace = true }
hi-db = { workspace = true }
hi-ingestion = { workspace = true }
hi-api = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.13",
    "pyright>=1.1.405",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.130",
    "pre-commit>=4.2",
    "respx>=0.22",
    "matplotlib>=3.10",
    "httpx2>=2.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "notebooks", "infra/migrations/versions/*.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF", "SIM", "C4", "PIE", "RET", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"scripts/**" = ["S603", "S607"]
"infra/migrations/versions/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hi_contracts", "hi_domain", "hi_db", "hi_ingestion", "hi_api"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["apps", "packages", "services", "scripts", "tests", "infra/migrations"]
exclude = ["**/node_modules", "**/.next", "docs", "data"]
strict = ["packages/contracts/src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers -p no:cacheprovider"
markers = [
    "db: requires Postgres at TEST_DATABASE_URL",
    "network: calls external APIs (excluded by default)",
    "slow: long-running",
]
