[project]
name = "hi-mcp"
version = "0.0.1"
description = "MCP server of the DATA product: tools over the domain services, never free SQL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hi-api",
    "hi-contracts",
    "mcp>=2.3,<3",
]

[project.scripts]
hi-mcp = "hi_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_mcp"]

[tool.uv.sources]
hi-api = { workspace = true }
hi-contracts = { workspace = true }
