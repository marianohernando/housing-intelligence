[project]
name = "hi-ingestion"
version = "0.0.1"
description = "Source harvesting and Bronze/Silver pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hi-contracts",
    "hi-domain",
    "hi-db",
    "geopandas>=1.1",
    "pyogrio>=0.11",
    "httpx>=0.28",
    "tenacity>=9.1",
    "typer>=0.17",
    "structlog>=25.1",
    "osmium>=4.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_ingestion"]

[tool.uv.sources]
hi-contracts = { workspace = true }
hi-domain = { workspace = true }
hi-db = { workspace = true }

[project.scripts]
hi-ingest = "hi_ingestion.cli:app"
