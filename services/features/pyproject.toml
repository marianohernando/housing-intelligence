[project]
name = "hi-features"
version = "0.0.1"
description = "Gold layer: deterministic features computed from metric observations and places"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hi-contracts",
    "hi-db",
    "hi-ingestion",
    "pandas>=2.2",
    "typer>=0.17",
]

[project.scripts]
hi-features = "hi_features.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_features"]

[tool.uv.sources]
hi-contracts = { workspace = true }
hi-db = { workspace = true }
hi-ingestion = { workspace = true }
