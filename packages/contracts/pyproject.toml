[project]
name = "hi-contracts"
version = "0.0.1"
description = "Shared Pydantic contracts (catalog, API envelopes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_contracts"]
