[project]
name = "hi-db"
version = "0.0.1"
description = "ORM models and DB session"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hi-contracts",
    "sqlalchemy>=2.0.43",
    "geoalchemy2>=0.18",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_db"]

[tool.uv.sources]
hi-contracts = { workspace = true }
hi-domain = { workspace = true }
hi-db = { workspace = true }
