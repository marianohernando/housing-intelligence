[project]
name = "hi-api"
version = "0.0.1"
description = "FastAPI application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hi-contracts",
    "hi-db",
    "hi-domain",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_api"]

[tool.uv.sources]
hi-contracts = { workspace = true }
hi-domain = { workspace = true }
hi-db = { workspace = true }
