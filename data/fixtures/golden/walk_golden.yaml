_note: >
  Golden walking-access cases (Gate 3, CORE-005). The bounds say what anyone who knows the place
  can tell (Sol has pharmacies and the metro at the door; La Acebeda, a Sierra Norte village of
  about 70 people, has a consultorio but no pharmacy in the CM register), not what the method
  happened to compute. Zones are the census sections of the golden Madrid zones
  (madrid_zones.json), two districts, two municipios and the region. Every case also needs a
  value and a confidence of at least 0.5. Checked against the OSM network and the CM registers
  loaded on 2026-11-11.
