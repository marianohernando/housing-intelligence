# Golden search scenarios (CORE-003, D-215): ScenarioState v2 built from the golden user profiles
# (user_profiles.yaml). Fully synthetic people; anchors are public landmarks. Trip limits go as
# preferences (max_minutes: null). Since CORE-009 (D-220) work is scored by minutes by public
# transport, so the place-of-work expectations are in minutes (`top_within_minutes`); the km ones
# that still hold stay. `expect` is what the search must give on the real local data:
# scripts/golden_search.py checks it (evidence).
scenarios:
  - profile_id: golden_family  # the demo case: a couple with two children who work on the Castellana
    scenario:
      budget: {kind: rent, amount_eur: 1500}
      household: {adults: 2, minors: 2, minor_ages: [4, 8]}
      anchors: [{kind: work, label: Paseo de la Castellana (Azca), lon: -3.6930, lat: 40.4500, days_per_week: 4, max_minutes: null}]
      nearby: [{need: colegio, max_walk_minutes: 10, required: true}]
      priorities: [colegios, transporte, salud]
    expect: {min_results: 10, results_within_km: 15, top_within_minutes: 35, binding: "near:colegio"}
  - profile_id: golden_single
    scenario:
      budget: {kind: rent, amount_eur: 900}
      household: {adults: 1}
      anchors: [{kind: work, label: Nuevos Ministerios, lon: -3.6912, lat: 40.4460, days_per_week: 4, max_minutes: null}]
      priorities: [transporte]
    expect: {min_results: 10, top_within_minutes: 40}
  - profile_id: golden_couple  # purchase: no open official prices yet, so nothing can pass (D-203)
    scenario:
      budget: {kind: buy, amount_eur: 320000}
      household: {adults: 2}
      anchors:
        - {kind: work, label: Méndez Álvaro, lon: -3.6795, lat: 40.3964, days_per_week: 3, max_minutes: null}
        - {kind: work, label: Alcobendas centro, lon: -3.6409, lat: 40.5475, days_per_week: 5, max_minutes: null}
      priorities: [zonas_verdes, transporte]
    expect: {max_results: 0, all_unknown: true}
  - profile_id: golden_single_parent_no_car
    scenario:
      budget: {kind: rent, amount_eur: 1200}
      household: {adults: 1, minors: 2, minor_ages: [6, 10]}
      anchors: [{kind: work, label: Atocha, lon: -3.6907, lat: 40.4066, days_per_week: 5, max_minutes: null}]
      nearby: [{need: colegio, max_walk_minutes: 10, required: true}, {need: transporte, max_walk_minutes: 5, required: true}]
      priorities: [colegios, transporte]
    expect: {min_results: 10, top_within_km: 10, top_within_minutes: 40}
  - profile_id: golden_senior
    scenario:
      budget: {kind: rent, amount_eur: 750}
      household: {adults: 1}
      anchors: [{kind: family, label: Hijo en Getafe centro, lon: -3.7329, lat: 40.3057, days_per_week: 2, max_minutes: null}]
      nearby: [{need: farmacia, max_walk_minutes: 10, required: true}, {need: centro_salud, max_walk_minutes: 15, required: true}]
      priorities: [salud, transporte, sin_escaleras]
    expect: {min_results: 3, top_within_km: 15}
  - profile_id: golden_student  # 500 €/month for 61 m²: only a few cheap municipios far away; the budget binds
    scenario:
      budget: {kind: rent, amount_eur: 500}
      household: {adults: 1}
      anchors: [{kind: study, label: URJC Vicálvaro, lon: -3.6090, lat: 40.4050, days_per_week: 5, max_minutes: null}]
      priorities: [transporte]
    expect: {max_results: 5, binding: budget}
  - profile_id: golden_sensory_preferences  # D-222: green areas first (the profile's «green»)
    scenario:
      budget: {kind: rent, amount_eur: 1000}
      household: {adults: 1, minors: 1, minor_ages: [9]}
      anchors: [{kind: study, label: Colegio en Chamberí, lon: -3.7037, lat: 40.4340, days_per_week: 5, max_minutes: null}]
      priorities: [zonas_verdes, transporte]
    expect: {min_results: 10, top_green_strength: 5}
  - profile_id: golden_reduced_mobility  # D-223: «sin escaleras» first (opt-in, a functional need)
    scenario:
      budget: {kind: rent, amount_eur: 1100}
      household: {adults: 2}
      anchors: [{kind: other, label: Hospital La Paz, lon: -3.6873, lat: 40.4813, days_per_week: 1, max_minutes: null}]
      priorities: [sin_escaleras, salud, transporte]
    expect: {min_results: 10, top5_step_free_within_minutes: 15}
