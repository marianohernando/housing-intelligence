notes: >-
  D-250. Los servicios que publican los conjuntos de datos «Urbanismo. Destino urbanístico del
  suelo» (300744) y «Planeamiento y desarrollos del PGOUM» (300489) de datos.madrid.es, ambos
  con license_id cc-by (comprobado en su CKAN el 19 nov). Condiciones generales del
  Ayuntamiento: citar «Origen de los datos: Ayuntamiento de Madrid» y la fecha, y no sugerir
  que el Ayuntamiento participa en la reutilización. La propia ficha de 300744 dice que la
  información carece de valor jurídico: la ficha de la parcela lo repite siempre. Se pregunta
  por un punto (la capa 3 de USOS_SUELO y la capa 3 de PLANEAMIENTO_URBANISTICO) en cada
  búsqueda que no está en caché.
