notes: >-
  D-250. Uso, también comercial, solo de la información transformada (art. 21 del texto
  refundido de la Ley de Propiedad Intelectual): la información original no se difunde sin
  transformar, y un producto propio no se llama «información catastral», «cartografía
  catastral» ni nada que pueda confundirse con ellas. La licencia no trae fórmula de
  atribución; la cita (la Dirección General del Catastro y la fecha de acceso) sigue la
  cláusula 12 de la licencia de descarga de 2011. Prevé la suspensión del servicio por uso
  intensivo. El WFS de edificios respondió el 2026-10-20; para cargas masivas, ATOM por
  municipio (docs/02_data/31).
