notes: >-
  D-242. Fuente complementaria, no es dataset CM: rellena el alquiler donde el dataset CM no lo
  publica (municipios de menos de 20.000 habitantes, barrios sin código postal). Es la misma
  explotación de fuentes tributarias (IRPF y Catastro) que el dato CM, pero publica la mediana y
  los cuartiles por m² y el número de viviendas alquiladas como vivienda habitual. El portal del
  Ministerio responde 403 a clientes automáticos; las condiciones de reutilización las revisó la
  línea de investigación el 14 nov y el fichero se descarga sin restricciones del CDN.
