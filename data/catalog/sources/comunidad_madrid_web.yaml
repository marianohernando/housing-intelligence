  D-241. Páginas web de la Comunidad de Madrid que no publican fichero; no son datasets del
  portal de datos abiertos y no cuentan como tales. El aviso legal (consultado el 14 nov) dice:
  «La Comunidad de Madrid permitirá la reutilización de todos los contenidos y datos difundidos
  por medio de este sitio, siempre que no se indique lo contrario, a condición de que no se
  altere el contenido de la información, no se modifique o desnaturalice el sentido de la
  información, se mencione la fuente, se indique la fecha de extracción o uso de la
  información, y no se pueda deducir que la Comunidad de Madrid patrocina o apoya la actividad
  en la que se reutiliza la información». Se transcribe a mano, con la cita exacta, en
  data/catalog/manual/ (nunca scraping).
