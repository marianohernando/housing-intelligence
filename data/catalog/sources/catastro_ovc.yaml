notes: >-
  D-250. Datos no protegidos de una parcela por su referencia (Consulta_DNPRC), su punto de
  referencia (Consulta_CPMRC), la parcela de un punto (Consulta_RCCOOR) y las de un número de
  una calle (ObtenerNumerero), para la búsqueda por parcela de la versión para inversores. El
  documento de los servicios solo dice que «pueden ser invocados por cualquier ciudadano» y
  datos.gob.es no les asigna licencia: se les aplica la de los servicios INSPIRE. La API solo
  devuelve campos transformados y agregados (sin la lista de inmuebles con su planta y su
  puerta), no guarda sus respuestas fuera de la memoria del proceso y los tests usan respuestas
  sintéticas. Se pregunta solo en las búsquedas que no están en caché, con un límite por IP.
