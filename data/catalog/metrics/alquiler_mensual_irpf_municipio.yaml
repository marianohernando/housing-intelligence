metric_id: alquiler_mensual_irpf_municipio
human_name: Alquiler medio mensual de la vivienda habitual, todos los contratos y los nuevos (municipios de más de 20.000 habitantes)
description: >-
  Ingresos por alquiler de vivienda habitual declarados en el IRPF, elevados a un mes, de
  todos los contratos (contratos=todos) y de los formalizados en el año (contratos=nuevos).
  Agencia Tributaria, Estadística de viviendas declaradas en IRPF.
domain: housing
unit: EUR/mes
direction: lower_is_better
aggregation_method: none
geo_resolution_min: municipio
temporal_resolution: annual
dataset_id: aeat_alquiler_nuevos_contratos_municipios
dimensions: [contratos]
