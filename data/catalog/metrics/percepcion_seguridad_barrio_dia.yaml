metric_id: percepcion_seguridad_barrio_dia
human_name: Percepción de seguridad en el barrio de día
description: >-
  Valoración media, de 0 a 10, de la seguridad del barrio o la zona donde vive, durante el día,
  según la Encuesta de calidad de vida y satisfacción con los servicios públicos del Ayuntamiento
  de Madrid (residentes de 16 años o más, unas 400 personas por distrito). Publicada en el panel
  de indicadores de distritos y barrios; se usa tal cual, por distrito y para la ciudad (D-226).
domain: safety
unit: puntos (0-10)
direction: higher_is_better
aggregation_method: none
geo_resolution_min: distrito
temporal_resolution: annual
dataset_id: ayto_panel_indicadores_distritos_barrios
