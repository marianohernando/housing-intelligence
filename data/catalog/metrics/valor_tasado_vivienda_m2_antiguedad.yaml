metric_id: valor_tasado_vivienda_m2_antiguedad
human_name: Valor tasado medio de la vivienda libre por m², por antigüedad (municipios)
description: >-
  Media anual del valor de tasación por metro cuadrado de la vivienda libre de hasta cinco años
  y de más de cinco años, en los municipios de más de 25.000 habitantes con tasaciones
  suficientes. Estadística de Valor Tasado de la Vivienda del Ministerio de Vivienda y Agenda
  Urbana, publicada en el portal de la CM.
