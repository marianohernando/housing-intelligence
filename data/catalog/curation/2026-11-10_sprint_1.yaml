# Curation of Comunidad de Madrid portal tables for the DATAMAD demo (Sprint 1, DATA-016).
# Basis: D-194 (per-zone list of what is missing) and the competition plan §3 (CM open data).
# Each table feeds a GAP-001 row or the people search; all use the Instituto de Estadística
# long format (Año | Tipo territorio | Código territorio | Territorio | ... | Valor).
# Apply with: uv run hi-ingest catalog curate data/catalog/curation/2026-11-10_sprint_1.yaml
reviewed_by: claude-code
municipio: &municipio {geo: {resolution: municipio}}
entries:
  - {candidate_id: "comunidad_madrid_ckan:farmacias", dataset_id: cm_farmacias_municipios, priority: P0, note: "GAP-001 pharmacy row: pharmacies per 10,000 inhabitants by municipio", overrides: {<<: *municipio, domain: health}}
  - {candidate_id: "comunidad_madrid_ckan:unidades_centros_no_universitarios_general_por_tipo_y_ensenanza", dataset_id: cm_unidades_escolares, priority: P0, note: "GAP-001 nursery and school rows: school units (classrooms) as capacity proxy", overrides: {<<: *municipio, domain: education}}
  - {candidate_id: "comunidad_madrid_ckan:mnp_nacidos_vivos_por_residencia_y_sexo", dataset_id: cm_nacidos_vivos_municipios, priority: P0, note: "GAP-001 nursery row: births as demand for 0-3 places", overrides: {<<: *municipio, domain: population}}
  - {candidate_id: "comunidad_madrid_ckan:censo_2021_viviendas_familiares_por_tenencia", dataset_id: cm_viviendas_tenencia_censo_2021, priority: P0, note: "GAP-001 housing row and people search: share of rented homes", overrides: {<<: *municipio, domain: housing}}
