limitations:
  - "Número de unidades urbanas del Catastro de uso «suelo vacante» del último año publicado por la Comunidad de Madrid (2026): solares sin edificar inscritos como tales. Es un recuento, no una superficie: un solar pequeño y uno grande cuentan uno cada uno. No dice si están en venta, su calificación ni cuánto se puede construir."
  - "Por municipio; la Comunidad no lo publica por distrito (la tabla por distrito agrupa el suelo vacante en «resto de usos»)."
  - "Dato de contexto de la Comunidad de Madrid para la versión para inversores: no puntúa en el buscador, no ordena zonas y no entra en «Qué falta» (D-247)."
