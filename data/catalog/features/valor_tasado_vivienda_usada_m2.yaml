limitations:
  - "Es el valor de tasación de la vivienda libre de más de 5 años (Estadística de Valor Tasado de la Vivienda del Ministerio de Vivienda y Agenda Urbana, en el portal de la CM), no el precio de un anuncio ni el de una venta concreta."
  - "Solo municipios de más de 25.000 habitantes con tasaciones suficientes de esa antigüedad; el resto queda sin datos, nunca 0. En un distrito de Madrid se enseña la cifra de toda la ciudad, con esa etiqueta."
  - "Dato de contexto: no cambia el precio de compra del buscador (D-227, D-234), no puntúa, no ordena zonas y no entra en «Qué falta» (D-241)."
