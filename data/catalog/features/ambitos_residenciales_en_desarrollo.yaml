limitations:
  - "Ámbitos de ordenación del Plan General de uso residencial con alguna fase sin terminar (planeamiento, gestión, proyecto u obras de urbanización), según el Ayuntamiento de Madrid (VEDA). Dice dónde se prepara suelo para vivienda, no cuántas viviendas habrá ni cuándo."
  - "Tres etapas: «urbanización en obras» (las obras de urbanización están en marcha), «en tramitación» (otra fase está en marcha) y «sin empezar» (nada en marcha). Algunos ámbitos llevan años sin empezar."
  - "Solo los 21 distritos de Madrid capital; un distrito sin ámbitos residenciales pendientes tiene 0. El resto de la región queda sin datos."
  - "Dato de contexto: no puntúa en el buscador, no ordena zonas y no entra en «Qué falta» (D-241)."
