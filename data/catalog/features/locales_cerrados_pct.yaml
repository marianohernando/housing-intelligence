feature_id: locales_cerrados_pct
version: 1
human_name: Locales cerrados (% de los locales que siguen existiendo)
domain: economy
type: derived
unit: "%"
direction: neutral
geo_level: distrito
time_semantics: snapshot
sources:
  - {dataset_id: ayto_censo_locales_actividades, role: primary}
formula:
  method: metric_share
  metric: locales_censo
  numerator: {situacion: [cerrado]}
  denominator: {situacion: [abierto, cerrado, obras]}
  levels:
    barrio: {}  # D-247: the investor pilot is by barrio
null_policy: {no_coverage: unknown, confirmed_zero: 0}
confidence: {inputs: [source_freshness]}
public_use: true
pro_use: true
models: []
tests: [non_negative, context_only]
limitations:
  - "Locales cerrados (sin actividad) entre los abiertos, los cerrados y los que están en obras, según el censo de locales y actividades del Ayuntamiento de Madrid (foto diaria), con acceso desde la calle o en una agrupación. Los que se usan como vivienda y los dados de baja no cuentan: ya no son locales."
  - "El Ayuntamiento avisa de que la situación es difícil de mantener: un cierre sin una actividad nueva puede tardar en llegar al censo, así que el porcentaje puede quedarse corto."
  - "Solo Madrid capital, por distrito y por barrio. Dato de contexto para la versión para inversores: no puntúa en el buscador, no ordena zonas y no entra en «Qué falta» (D-247)."
