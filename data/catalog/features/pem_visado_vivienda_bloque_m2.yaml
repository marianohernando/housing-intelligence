limitations:
  - "Es el presupuesto de ejecución material que declaran los visados de dirección de obra nueva (Estadística de Obras en Edificación, Ministerio de Vivienda, en el portal de la CM), no el coste total de la obra: le faltan los gastos generales y el beneficio del constructor, los honorarios, la licencia y los impuestos. Suele declararse a la baja (D-248)."
  - "Solo el total de la región y el último año publicado; la superficie es la construida total que declara el visado. No hay coste de construcción abierto por zona."
  - "Dato de partida de la viabilidad v0 de la versión para inversores (D-248): no puntúa, no ordena zonas y no entra en «Qué falta»."
