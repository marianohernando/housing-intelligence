feature_id: min_a_pie_estacion_sin_escaleras
version: 1
human_name: "Minutos a pie hasta la estación de metro, Metro Ligero o Cercanías accesible (sin escaleras) más cercana (mediana de las calles de la zona)"
domain: transport
type: derived
unit: min
direction: lower_is_better
geo_level: seccion_censal
time_semantics: current
sources:
  - {dataset_id: osm_red_peatonal, role: primary}
  - {dataset_id: crtm_gtfs_metro, role: primary}
  - {dataset_id: crtm_gtfs_metro_ligero, role: primary}
  - {dataset_id: crtm_gtfs_cercanias, role: primary}
  - {dataset_id: crtm_topologia_metro, role: primary}
  - {dataset_id: crtm_topologia_metro_ligero, role: primary}
  - {dataset_id: crtm_topologia_cercanias, role: primary}
formula:
  method: network_walk_time
  destination_category: transport
  subcategories: ["metro", "metro_ligero", "cercanias"]
  attributes: {step_free: ["yes"]}
  statistic: median_minutes
  speed_kmh: 4.0
  origin_highways: ["residential", "living_street", "unclassified", "pedestrian", "tertiary"]
  min_street_m: 300  # less origin street than this -> confidence 0.5 at most
  levels: {municipio: {}, distrito: {}}
null_policy: {no_coverage: unknown, confirmed_zero: 0}
confidence: {inputs: [reachable_street_share, min_street_m]}
public_use: true
pro_use: true
models: [residential_fit]
tests: [non_negative, explicit_null_without_streets, unknown_never_near]
limitations:
  - "Proxy declarado de «sin escaleras»: mide la estación de tren o metro con accesibilidad total según la topología del CRTM (grado T). No mide autobuses (el CRTM declara accesibles el 100 % de los urbanos e interurbanos), aceras, portales ni ascensores de los edificios."
  - "Una estación con accesibilidad parcial (grado P) o sin ella (N) no cuenta. Un intercambiador cuenta solo si todas sus estaciones de línea son T. Una estación que no está en la topología queda sin dato y no cuenta."
  - "El grado es el publicado por el CRTM: no dice si un ascensor funciona hoy."
  - "Velocidad de 4 km/h para todo el mundo, la del estudio «El Madrid de los 15 minutos» del Ayuntamiento: con movilidad reducida o en silla de ruedas los minutos son más."
  - "Las calles donde vive la gente se aproximan por el tipo de vía de OSM (residencial, de convivencia, sin clasificar, peatonal y terciaria), ponderadas por su longitud: no es la población."
  - "Cada estación se une a la red por su punto más cercano en línea recta: no se ven sus accesos."
  - "Una zona sin calles residenciales en OSM queda SIN DATOS y una cuyas calles no conectan con la red queda desconocida; nunca vale 0."
fit: {role: walk_minutes, priority: sin_escaleras}
