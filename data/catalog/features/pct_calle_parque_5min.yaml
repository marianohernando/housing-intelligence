feature_id: pct_calle_parque_5min
version: 1
human_name: "% de las calles de la zona a 5 minutos a pie o menos del borde de un parque urbano de 1 ha o más"
domain: environment
type: derived
unit: "% de calle"
direction: higher_is_better
geo_level: seccion_censal
time_semantics: current
sources:
  - {dataset_id: osm_red_peatonal, role: primary}
  - {dataset_id: osm_parques, role: primary}
formula:
  method: network_walk_time
  destination_category: green
  subcategories: ["Parque"]
  statistic: share_within
  within_minutes: 5  # ~300 m: the WHO indicator measures 300 m in a straight line
  speed_kmh: 4.0
  origin_highways: ["residential", "living_street", "unclassified", "pedestrian", "tertiary"]
  min_street_m: 300  # less origin street than this -> confidence 0.5 at most
  levels: {municipio: {}, distrito: {}, barrio: {}}  # with its median, every zone (D-232)
null_policy: {no_coverage: unknown, confirmed_zero: 0}
confidence: {inputs: [reachable_street_share, min_street_m]}
public_use: true
pro_use: true
models: [residential_fit]
tests: [range_0_100, explicit_null_without_streets, unknown_never_near]
limitations:
  - "Solo parques urbanos de OpenStreetMap de 1 ha o más (el tamaño mínimo del indicador de la OMS), más los que el Ayuntamiento lista como parque y OSM etiqueta de otra forma (Casa de Campo, Quinta de Torre Arias). El campo, los bosques y las plazas pequeñas no cuentan: en los pueblos rodeados de campo los minutos no dicen cuánto verde hay cerca."
  - "Se llega al parque por cualquier punto de su borde (uno cada 50 m), no por sus puertas: en parques vallados la entrada puede estar más lejos."
  - "Velocidad de 4 km/h para todo el mundo, la del estudio «El Madrid de los 15 minutos» del Ayuntamiento: con movilidad reducida o con carrito los minutos son más."
  - "Las calles donde vive la gente se aproximan por el tipo de vía de OSM (residencial, de convivencia, sin clasificar, peatonal y terciaria), ponderadas por su longitud: no es la población."
  - "Una zona sin calles residenciales en OSM queda SIN DATOS y una cuyas calles no conectan con la red queda desconocida; nunca vale 0."
