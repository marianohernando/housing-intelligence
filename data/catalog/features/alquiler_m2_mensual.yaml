feature_id: alquiler_m2_mensual
version: 2
human_name: Alquiler medio por metro cuadrado (viviendas habituales)
domain: housing
type: raw
unit: EUR/m2/mes
direction: lower_is_better
geo_level: municipio
time_semantics: snapshot
sources:
  - {dataset_id: cm_alquiler_m2_municipios, role: primary, levels: [municipio]}
  - {dataset_id: cm_alquiler_m2_codigo_postal_madrid, role: primary, levels: [distrito]}
  # The places whose address carries a postcode locate each postcode in the districts (CORE-006)
  - {dataset_id: cm_centros_educativos, role: secondary, levels: [distrito]}
  - {dataset_id: cm_centros_sanitarios, role: secondary, levels: [distrito]}
  - {dataset_id: cm_centros_atencion_social, role: secondary, levels: [distrito]}
formula:
  method: metric_value
  metric: alquiler_m2_mensual_municipio
  dims: {tipo_vivienda: viviendas_habituales}
  levels:
    distrito:
      method: postcode_weighted_mean
      metric: alquiler_m2_mensual_codigo_postal
      dims: {}
      postcode_attributes: [cdpostal, direccion_codigo_postal]
      postcode_municipio: "28079"  # the source publishes postcodes of Madrid capital only
      confidence: 0.8  # declared proxy: places locate the postcodes, not dwellings (D-214)
null_policy: {no_coverage: unknown, confirmed_zero: unknown}
confidence: {inputs: [source_freshness, postcode_coverage]}
public_use: true
pro_use: true
models: [affordability, reality_check]
tests: [positive, district_between_its_postcodes, unknown_never_zero]
limitations:
  - "Solo municipios de más de 20.000 habitantes con contratos suficientes; el resto queda como desconocido, nunca como 0."
  - "Es la media de los alquileres declarados en el IRPF (contratos vigentes, no anuncios): un contrato nuevo suele costar más."
  - "Los metros cuadrados son los del Catastro (superficie construida)."
  - "Distritos de Madrid (versión 2, D-214): media de los códigos postales del distrito, ponderada por cuántos colegios, centros de salud y centros sociales geocodificados del distrito llevan cada código en su dirección. No hay geometría de códigos postales: los lugares aproximan dónde vive la gente (proxy declarado, confidence 0,8 como máximo y menor si parte de esos lugares tiene un código sin alquiler publicado). Solo se publican códigos con más de 200 viviendas arrendadas y se usa el último periodo publicado."
