feature_id: plazas_mayores_a_pie_por_100_mayores
version: 1
human_name: "Plazas en hogares, clubes y centros de día al alcance a pie por cada 100 personas de 65 años o más"
domain: social
type: derived
unit: plazas/100 mayores
direction: higher_is_better
geo_level: municipio
time_semantics: current
sources:
  - {dataset_id: cm_centros_atencion_social, role: primary}
  - {dataset_id: osm_red_peatonal, role: primary}
  - {dataset_id: cm_poblacion_edad_nacionalidad_sexo, role: denominator, levels: [municipio]}
  - {dataset_id: ayto_padron_municipal, role: denominator, levels: [distrito]}
formula:
  method: two_step_fca
  category: social
  subcategories: ["HOGARES Y CLUBES", "CENTROS DE DÍA: OTROS"]
  supply: {kind: attribute, attribute: plazas_autorizadas_numero}
  catchment_minutes: 15  # «El Madrid de los 15 minutos» (Ayuntamiento), the source of D-211
  speed_kmh: 4.0
  origin_highways: ["residential", "living_street", "unclassified", "pedestrian", "tertiary"]
  population_metric: poblacion_censada
  population_dims: {edad: [de_65_69_anos, de_70_74_anos, de_75_79_anos, de_80_84_anos, de_85_89_anos, de_90_94_anos, de_95_99_anos, de_100_y_mas_anos], nacionalidad: [total], sexo: [total]}
  district_population: {metric: poblacion_padron, dims: {edad: [de_65_69_anos, de_70_74_anos, de_75_79_anos, de_80_84_anos, de_85_89_anos, de_90_94_anos, de_95_99_anos, de_100_y_mas_anos]}}
  small_population_threshold: 300  # people below this -> confidence 0.5
  per: 100
  confidence: 1.0
  levels: {distrito: {}}
null_policy: {no_coverage: unknown, confirmed_zero: 0}
confidence: {inputs: [source_freshness, small_population]}
public_use: true
pro_use: true
models: [family_fit]
tests: [non_negative, capacity_conserved]
limitations:
  - "2SFCA (Luo y Wang, 2003): la capacidad de cada centro se reparte entre quienes viven a 15 minutos a pie o menos (4 km/h por la red de calles, «El Madrid de los 15 minutos»); la zona suma lo que le llega a cada calle. Cruza los límites de municipio y distrito."
  - "La gente se coloca en las calles donde vive (D-210), en proporción a su longitud dentro de su municipio o, en Madrid, de su distrito (padrón escalado al total del censo): no es la población de cada portal."
  - "Quien vive a más de 15 minutos a pie de cualquier centro no suma oferta: la fila mide lo que se tiene cerca, no lo que hay en coche o en autobús."
  - "Un centro sin plazas en el registro no suma capacidad (1 de 532)."
gap_row: {row: mayores, role: primary, label: "Centros de mayores", phrase: "plazas en hogares, clubes y centros de día al alcance a pie por cada 100 personas de 65 años o más", proxy_note: "Plazas autorizadas del registro de la CM: en un hogar o club es el aforo, en un centro de día son plazas de atención diurna. Las residencias van aparte. No incluye los centros municipales de mayores del Ayuntamiento de Madrid, que no están en ese registro."}
