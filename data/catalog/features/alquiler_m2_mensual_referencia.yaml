feature_id: alquiler_m2_mensual_referencia
version: 1
human_name: Alquiler por metro cuadrado de un contrato nuevo, referencia del Ministerio de Vivienda (donde la Comunidad no lo publica)
domain: housing
type: derived
unit: EUR/m2/mes
direction: lower_is_better
geo_level: municipio
time_semantics: snapshot
sources:
  # D-242: the Ministry's rent reference (SERPAVI), not CM: it only fills where the CM publishes none
  - {dataset_id: mivau_serpavi_alquiler, role: primary}
  # The CM rent sets the scale: CM mean / SERPAVI median, measured where both exist
  - {dataset_id: cm_alquiler_m2_municipios, role: secondary}
  # D-228: how much more a m² costs in the leases signed in the year (Agencia Tributaria)
  - {dataset_id: aeat_alquiler_nuevos_contratos_municipios, role: secondary}
formula:
  # D-242: zone €/m² = SERPAVI median (flats, else single-family homes) x calibration x the
  # new-lease factor of D-228; p25 and p75 only x that factor (the calibration moves the centre,
  # not the spread). The calibration is the median, over the municipios with both, of CM mean /
  # SERPAVI median in the same year.
  method: reference_rent_fill
  metric: alquiler_m2_mensual_serpavi
  count_metric: contratos_alquiler_serpavi
  typologies: [colectiva, unifamiliar]  # the first with a published median
  typology_dim: tipologia
  statistic_dim: estadistico
  calibration:
    metric: alquiler_m2_mensual_municipio
    dims: {tipo_vivienda: viviendas_habituales}
    level: municipio
    min_zones: 20  # fewer municipios with both figures stop the computation
  new_contracts:
    rent_metric: alquiler_mensual_irpf_municipio
    area_metric: m2_alquiler_irpf_municipio
    level: municipio
    # D-243 (review R-03 of D-242): no filled municipio has a table of its own, so they take the
    # median of the municipios' own factors (1.155 in 2024), not the region's row (1.2085, which
    # Madrid dominates)
    fallback: {median: true}
  confidence: 0.7  # another statistic of the same tax sources, scaled: «Dato aproximado»
  few_contracts: {below: 30, max_confidence: 0.4}  # «Dato poco seguro»
  typology_confidence: {unifamiliar: 0.5}  # houses: the cost for the household's m² falls short
  levels:
    distrito:  # Madrid's districts; the census district is the municipal one
      within_municipio: "28079"
      new_contracts:
        rent_metric: alquiler_mensual_irpf_municipio
        area_metric: m2_alquiler_irpf_municipio
        level: municipio
        fallback: {code: "28079"}
    barrio:  # the census sections of the barrio, weighted by their leases
      source_level: seccion_censal
      within_municipio: "28079"
      new_contracts:
        rent_metric: alquiler_mensual_irpf_municipio
        area_metric: m2_alquiler_irpf_municipio
        level: municipio
        fallback: {code: "28079"}
null_policy: {no_coverage: unknown, confirmed_zero: unknown}
confidence: {inputs: [source_freshness, calibration, contracts]}
public_use: true
pro_use: true
models: [affordability, reality_check]
tests: [positive, unknown_never_zero, calibrated_to_cm, quartiles_scaled_with_the_median]
limitations:
  - "Solo rellena: donde la Comunidad de Madrid publica el alquiler (alquiler_m2_mensual), manda ese dato. La búsqueda usa este solo en las zonas sin él."
  - "Es la mediana del alquiler por m² de los alquileres de vivienda habitual vigentes declarados en el IRPF (Sistema Estatal de Referencia del Precio del Alquiler de Vivienda, Ministerio de Vivienda, con el Catastro), no una media ni un contrato del año: se lleva al nivel del dato de la Comunidad con el cociente medio de las dos cifras donde existen ambas (mediana de los cocientes, entre 0,97 y 1,08 en 2024), y a un contrato firmado en el año con el factor de la Agencia Tributaria (D-228). Es una elaboración propia a partir del dato del Ministerio. Los percentiles 25 y 75 solo se multiplican por el factor de contratos nuevos: el cociente corrige el centro (media frente a mediana), no la dispersión."
  - "Factor de contratos nuevos: ningún municipio rellenado tiene tabla propia de la Agencia Tributaria, así que todos usan el de reserva, la mediana de los factores de los 37 municipios de la tabla (1,155 en 2024; D-243). Hasta el 15 nov era la fila de la Comunidad (1,2085), que suma esos 37 municipios y la domina Madrid: daba un alquiler entre un 4 y un 5 % más alto. Es un factor común: no dice cuánto sube el alquiler de un contrato nuevo en cada pueblo."
  - "Pisos (vivienda colectiva) y, si no hay bastantes pisos alquilados, casas unifamiliares: su €/m² es más bajo y el coste de los m² del hogar se queda corto (confidence 0,5 como máximo)."
  - "Con menos de 30 contratos detrás de la mediana, confidence 0,4 como máximo. La fuente no publica la mediana con menos de 10 viviendas: esas zonas quedan SIN DATOS, nunca 0."
  - "Barrios de Madrid: media de las secciones censales del barrio ponderada por sus contratos (una media de medianas, no la mediana del barrio), y su rango, la media de los rangos de sus secciones, dicho así en el texto. La sección se asigna a su barrio con la geografía de la base (seccionado de la Comunidad); el SERPAVI usa el seccionado de 2021."
fit: {role: rent_m2_fill, note: "referencia del Ministerio de Vivienda llevada a contratos firmados en 2024; un anuncio de hoy puede pedir más", source: "Elaboración propia a partir del Ministerio de Vivienda (SERPAVI), 2024"}
