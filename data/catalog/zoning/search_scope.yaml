# «Dónde buscar» (D-238): which part of the Comunidad de Madrid each municipio belongs to.
#
# The parts are not ours: they group the 11 zones of the statistical zoning (NUTS 4) that the
# Instituto de Estadística de la Comunidad de Madrid uses in its own tables. «Madrid capital» is
# zone 01, «Alrededores» the four metropolitan zones (02-05) and «Pueblos» the other six.
# The list of municipios is copied as published (code of the Comunidad de Madrid and name).
#
# The API cannot read this file at run time (its image only carries the Python packages), so
# packages/domain/src/hi_domain/geo/zoning_data.py is generated from it:
#   uv run python scripts/export_search_scope.py   (make lint and tests/data check it)
zoning_id: search_scope
source:
  publisher: Instituto de Estadística de la Comunidad de Madrid
  title: "Nomenclátor imprimible de la Comunidad de Madrid. 2025"
  section: "3.4. Zonificación estadística y relación de municipios"
  url: https://gestiona3.madrid.org/iestadis/fijas/estructu/general/territorio/descarga/nomenme25.pdf
  retrieved_at: "2026-11-14"
  notes: >-
    179 municipios in 11 zones. The same municipios are in each zone in the Institute's table of
    2010 («Zonificación estadística NUTS 4 de la Comunidad de Madrid»,
    https://web.comunidad.madrid/iestadis/fijas/estructu/general/territorio/descarga/indimuni10d03.pdf).
scopes:
  madrid: ["01"]
  alrededores: ["02", "03", "04", "05"]
  pueblos: ["06", "07", "08", "09", "10", "11"]
