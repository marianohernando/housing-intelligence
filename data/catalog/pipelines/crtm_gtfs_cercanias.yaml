kind: gtfs_feed
dataset_id: crtm_gtfs_cercanias
mode: cercanias
reference_weekday: tuesday
peak_start: "07:00"
peak_end: "09:00"
# D-223: each station reads its accessibility from the CRTM topology; the GTFS stop id is the
# operator's station code (CODIGOEMPRESA).
station_accessibility:
  dataset_id: crtm_topologia_cercanias
  match: operator_code
  stop_id_pattern: '^(\d+)$'
