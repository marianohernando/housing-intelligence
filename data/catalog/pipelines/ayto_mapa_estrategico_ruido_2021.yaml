# Strategic noise map of Madrid 2021 (D-237): one GeoTIFF per index inside the published ZIP.
# Only Ld (day, 7-19 h) and Ln (night, 23-7 h) are kept, as a compact grid in Silver: the day and
# night objectives of RD 1367/2007 are set on them (review of PR #65, R-02).
kind: noise_raster
dataset_id: ayto_mapa_estrategico_ruido_2021
layers:
  ld: Madrid_Ld_2021.tif
  ln: Madrid_Ln_2021.tif
crs: EPSG:25830
pixel_m: 5.0
nodata: 0.0
reference_year: 2021
min_cells_with_level: 6000000  # about half of the 13.2 million seen on 2026-11-14
