kind: gtfs_feed
dataset_id: crtm_gtfs_metro_ligero
mode: metro_ligero
reference_weekday: tuesday
peak_start: "07:00"
peak_end: "09:00"
# D-223: each station reads its accessibility from the CRTM topology (IDESTACION = «10_<code>»).
station_accessibility:
  dataset_id: crtm_topologia_metro_ligero
  match: station_id
  stop_id_pattern: '^(?:par|est)_(10_\d+)$'
