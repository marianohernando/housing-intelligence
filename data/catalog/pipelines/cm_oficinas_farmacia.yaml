municipio_name_column: MUNICIPIO_NOMBRE
address_template: "{DIRECCION_VIAL_TIPO} {DIRECCION_VIAL_NOMBRE} {DIRECCION_VIAL_NRO}, {MUNICIPIO_NOMBRE}"
