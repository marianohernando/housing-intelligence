# Annual mean of NO2 per station of the CM network in 2025 (D-237), from the hourly values
# flagged valid. Silver only: the air feature reads it.
kind: air_quality_hourly
dataset_id: cm_calidad_aire_horario_2025
csv: {decimal: ","}
