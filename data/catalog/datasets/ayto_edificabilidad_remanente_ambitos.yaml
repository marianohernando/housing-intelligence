  notes: >-
    D-247. Portal de datos abiertos del Ayuntamiento de Madrid (CC BY 4.0: «license_url» de la
    4.0 en su CKAN, comprobado el 19 nov). Semestral: el fichero de julio de 2026 trae 229 filas
    (225 ámbitos; cuatro en dos etapas) con su distrito, su situación y la edificabilidad
    disponible en m² para residencial colectiva y unifamiliar, industrial y terciario. No trae
    coordenadas: cada ámbito se sitúa en un barrio con un punto dentro de su polígono, leído una
    vez de la capa de ámbitos vigentes del propio visor VEDA (cuyas condiciones remiten al aviso
    legal de datos.madrid.es). El «Nº de viviendas» del fichero es la edificabilidad entre 100: no
    se usa.
