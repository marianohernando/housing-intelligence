notes: >-
  D-248: el coste de partida de la viabilidad v0 (PEM visado × un coeficiente editable). Las
  cifras pasan por data/catalog/manual/pem_visados_cm.yaml, que scripts/pem_visados_cm.py
  calcula del CSV oficial (con su sha256); la carga lee ese fichero, nunca el portal. Es un PEM
  declarado en el visado, no el coste total de la obra, y suele declararse a la baja.
