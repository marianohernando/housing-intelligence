  notes: >-
    D-250. Ayuntamiento de Madrid, CC BY 4.0 (license_id cc-by en su CKAN, comprobado el 19
    nov). El destino urbanístico de cada parcela del término municipal (40.021 polígonos), «interpretando
    lo contemplado en el PGOUM y sus alteraciones posteriores»; su ficha dice que la
    información carece de valor jurídico. La búsqueda por parcela lo lee en vivo, por un punto,
    y no lo carga en la base: la norma zonal y su grado o el ámbito, el uso pormenorizado y la
    parcela urbanística. D-252c: las tablas 4 y 5 (USO, EDIFICABIL y UNIDAD por el CODIGO =
    UBOV_ID de la parcela urbanística; 40.021 y 1.328 filas el 20 nov) se descargan enteras con
    scripts/usos_suelo_tablas.py y se leen de hi_domain.plan_uses_data: en vivo, una consulta en
    frío tarda 6,5–10 s en el servidor de sigma.
  reviewed_by: claude-code
  reviewed_at: '2026-11-19T20:00:00+00:00'
notes: >-
  Complementario, no es dataset CM (D-205): solo Madrid capital. Contexto de la ficha de
  parcela para inversores (D-250); no puntúa.
