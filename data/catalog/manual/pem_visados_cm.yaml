territory: 'Comunidad de Madrid. El fichero no trae columna de territorio y su ficha dice «Ámbito: Toda
  España», pero el portal es el de la Comunidad y la escala es la de la región: 1641 visados de obra nueva
  en 2025, cuando España suma decenas de miles al año'
method: PEM por m² = presupuesto de ejecución material de dirección de obra nueva (miles de euros × 1.000)
  / superficie a construir (m²), por año y tipo de edificio. Es la superficie construida total del edificio
  que declara el visado.
